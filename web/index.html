<!doctype html>
<html lang="en" data-api="__API__" data-build="__BUILD__" data-mode="__MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8">
<title>TodoTracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css?b=__BUILD__">
<script nonce="__NONCE__">
/* Set the theme before the first paint so the wrong theme never flashes. */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('tt-theme') || 'auto'; } catch (e) {}
  if (pref !== 'day' && pref !== 'night') pref = 'auto';
  var dark = pref === 'night' || (pref === 'auto' && !!window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches);
  var root = document.documentElement;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  root.setAttribute('data-theme-pref', pref);
  try {
    var c = getComputedStyle(root).getPropertyValue('--theme-color').trim();
    if (c) document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
  } catch (e) {}
})();
</script>
</head>
<body>
<a class="skip" href="#list">Skip to the list</a>
<div id="banner" class="banner" role="alert" hidden></div>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar" aria-label="Views and labels">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>TodoTracker
      <button id="menu-close" class="icon-btn menu-close" type="button" aria-label="Close views and labels">✕</button></div>
    <div id="side-content"></div>
  </aside>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

  <main id="main" class="main">
    <header class="topbar">
      <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Show views and labels" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="quickadd" id="quickadd">
        <label class="sr-only" for="qa">Add a task</label>
        <input id="qa" data-k="qa" type="text" autocomplete="off" spellcheck="true" maxlength="600"
               placeholder="Add a task…  #label  !high  ^fri@14:00   (Enter adds, Shift+Enter adds and opens)"
               aria-describedby="qa-chips" aria-autocomplete="list" aria-controls="qa-suggest" aria-expanded="false">
        <ul id="qa-suggest" class="suggest" role="listbox" aria-label="Label suggestions" hidden></ul>
        <div id="qa-chips" class="qa-chips" aria-live="polite"></div>
      </div>
      <button id="qa-add" class="btn primary qa-add" type="button" aria-label="Add the task">Add</button>
      <div class="search">
        <label class="sr-only" for="search">Search</label>
        <input id="search" data-k="search" type="search" autocomplete="off" placeholder="Search  (Ctrl+F)">
      </div>
    </header>

    <section id="list-page" class="page list-page" aria-labelledby="view-title">
      <div class="list-toolbar">
        <h1 id="view-title" class="view-title">All open</h1>
        <span id="view-sub" class="view-sub"></span>
        <label class="sort">Sort
          <select id="sort" data-k="sort">
            <option value="newest">Newest</option>
            <option value="due">Target date</option>
            <option value="priority">Priority</option>
          </select>
        </label>
      </div>
      <div id="list-scroll" class="list-scroll">
        <div id="list" class="list" role="list" tabindex="-1" aria-labelledby="view-title"></div>
      </div>
    </section>

    <section id="matrix-page" class="page matrix-page" aria-label="Eisenhower matrix" hidden></section>
  </main>

  <aside id="editor" class="editor" aria-label="Task details" hidden></aside>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Image" hidden>
  <button class="icon-btn lightbox-close" type="button" aria-label="Close image">✕</button>
  <img alt="">
</div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<input id="image-file" type="file" accept="image/*" multiple hidden>

<script src="/markdown.js?b=__BUILD__"></script>
<script src="/parse.js?b=__BUILD__"></script>
<script src="/localdb.js?b=__BUILD__"></script>
<script src="/app.js?b=__BUILD__"></script>
<script src="/matrix.js?b=__BUILD__"></script>
</body>
</html>
